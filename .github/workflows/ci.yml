name: Test
on:
  push:
  pull_request:

jobs:
  native-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Configure native core
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Build native core
        run: cmake --build build/native --parallel 2
      - name: Test native core
        run: ctest --test-dir build/native --output-on-failure
      - name: Test Python to C++ bridge
        env:
          WYNXO_NATIVE_CORE: ${{ github.workspace }}/build/native/libwynxo_native_core.so
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tempfile
          from wynxo.native_core import native_core
          assert native_core.available, native_core.error
          assert native_core.version == "0.2.0"
          assert native_core.normalize_permission_mode("garbage") == "safe"
          assert native_core.needs_confirmation("click", "safe")
          assert not native_core.needs_confirmation("move_pointer", "safe")
          assert native_core.command_is_destructive("git reset --hard HEAD~1")
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              (root / "src").mkdir()
              (root / "README.md").write_text("# scanner\n")
              scan = native_core.scan_directory(root, 10)
              names = {entry["name"] for entry in scan["entries"]}
              assert {"src", "README.md"} <= names
              assert scan["truncated"] is False
          print("python -> C++ native bridge: ok")
          PY
      - name: Build native wheel from installer release snapshot
        env:
          WYNXO_REQUIRE_NATIVE: "1"
        run: |
          rm -rf /tmp/wynxo-release-source /tmp/wynxo-wheel
          python3 - <<'PY'
          from pathlib import Path
          import install
          install._copy_source(Path.cwd(), Path("/tmp/wynxo-release-source"))
          for required in ("setup.py", "MANIFEST.in", "native/CMakeLists.txt"):
              assert (Path("/tmp/wynxo-release-source") / required).is_file(), required
          PY
          python3 -m pip wheel --no-deps --wheel-dir /tmp/wynxo-wheel /tmp/wynxo-release-source
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          wheel = next(Path("/tmp/wynxo-wheel").glob("wynxo-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          expected = "wynxo/native/libwynxo_native_core.so"
          assert expected in names, f"{expected} missing from {wheel.name}"
          print("installer release snapshot native wheel:", wheel.name)
          PY

  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      WYNXO_REQUIRE_NATIVE: "1"
      # Runs the QML load and interaction checks, which need a platform plugin.
      WYNXO_QML_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libasound2t64
      - name: Install package and test tools
        run: python -m pip install . pytest
      - name: Verify installed package contains C++ core
        run: |
          cd /tmp
          python - <<'PY'
          from pathlib import Path
          import tempfile
          from wynxo.native_core import native_core
          assert native_core.available, native_core.error
          assert native_core.version == "0.2.0"
          assert native_core.needs_confirmation("click", "safe")
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              (root / "native.txt").write_text("ok")
              scan = native_core.scan_directory(root, 8)
              assert [entry["name"] for entry in scan["entries"]] == ["native.txt"]
          print("packaged native core:", native_core.path)
          PY
      - name: Test core suite
        # The dock controller owns native Qt objects plus short-lived Python
        # worker threads. Keep it out of this long-lived pytest process so
        # native teardown from an earlier dock case cannot corrupt a later one.
        # The live streaming suite owns QCoreApplication + real QThreads and is
        # isolated below for the same reason.
        run: |
          git --version && /bin/bash --version | head -1
          python -m pytest -q --ignore=tests/test_live_stream.py --ignore=tests/test_dock_controller.py
      - name: Test dock controller in isolated processes
        # PySide can segfault when the filtering and stale-search dock cases
        # tear down back-to-back in one interpreter. Running every collected
        # test in its own process preserves full coverage and deterministic
        # cleanup instead of skipping the affected tests.
        run: |
          python - <<'PY'
          import subprocess
          import sys

          collected = subprocess.run(
              [sys.executable, "-m", "pytest", "--collect-only", "-q", "tests/test_dock_controller.py"],
              check=True, capture_output=True, text=True,
          )
          tests = [
              line.strip() for line in collected.stdout.splitlines()
              if line.startswith("tests/test_dock_controller.py::")
          ]
          if not tests:
              raise SystemExit("no dock controller tests collected")
          print(f"running {len(tests)} dock tests in isolated processes")
          for test in tests:
              print(f"::group::{test}")
              subprocess.run([sys.executable, "-m", "pytest", "-q", test], check=True)
              print("::endgroup::")
          PY
      - name: Test live Qt streaming
        run: python -m pytest -q tests/test_live_stream.py
      - name: Validate Python sources
        run: python -m compileall -q wynxo install.py uninstall.py setup.py
      - name: Load native GUI
        run: python -m wynxo --smoke-test

  screenshots:
    # Renders the real QML with fixed demo state so a UI regression is visible
    # in the artifacts rather than only in a reviewer's local checkout. Render
    # outside the checkout: otherwise the Changes scene sees the screenshots it
    # is currently creating as untracked Git files and ceases to test real code.
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      WYNXO_REQUIRE_NATIVE: "1"
      WYNXO_SCREENSHOT_DIR: /tmp/wynxo-ui-artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxkbcommon-x11-0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libasound2t64
      - name: Install package
        run: python -m pip install .
      - name: Render the interface
        run: python -m wynxo --snapshot "$WYNXO_SCREENSHOT_DIR/screenshots"
      - name: Render token usage states
        run: |
          python tests/token_usage_snapshot.py "$WYNXO_SCREENSHOT_DIR/token-usage-live.png" live
          python tests/token_usage_snapshot.py "$WYNXO_SCREENSHOT_DIR/token-usage-idle.png" idle
      - name: Check every scene rendered
        run: |
          count=$(ls "$WYNXO_SCREENSHOT_DIR"/screenshots/*.png | wc -l)
          expected=$(python -c "from wynxo.demo import SCENES; print(len(SCENES))")
          test "$count" -eq "$expected" || { echo "expected $expected screenshots, got $count"; exit 1; }
          test -s "$WYNXO_SCREENSHOT_DIR/token-usage-live.png" || { echo "live token usage snapshot missing"; exit 1; }
          test -s "$WYNXO_SCREENSHOT_DIR/token-usage-idle.png" || { echo "idle token usage snapshot missing"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: wynxo-screenshots
          path: /tmp/wynxo-ui-artifacts
