[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wynxq"
version = "1.0.0"
description = "A local Ollama copilot for the Linux desktop"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Wynxq contributors"}]
dependencies = [
  "PySide6>=6.8,<7",
  "httpx>=0.27,<1",
  "dbus-next>=0.2.3,<0.3",
  "Pillow>=10,<13",
  "python-xlib>=0.33,<0.34",
]

[project.scripts]
wynxq = "wynxq.__main__:main"

[project.urls]
Repository = "https://github.com/wynxo/wynxq-gui"

[tool.setuptools.packages.find]
include = ["wynxq*"]

[tool.setuptools.package-data]
wynxq = [
  "ui/*.qml", "ui/**/*.qml", "ui/*.svg", "ui/**/qmldir",
  "ui/fonts/*.ttf", "ui/fonts/*.txt",
  "qml/*.qml", "qml/**/*.qml", "assets/*", "assets/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "PySide6.*",
    "shiboken6.*",
    "Xlib.*",
    "dbus_next.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "TCH",
    "RUF",
]
ignore = [
    "E500",
    "B008",
    "RUF001",
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "S101"]
"wynxq/__main__.py" = ["E402"]
"install.py" = ["E402"]
